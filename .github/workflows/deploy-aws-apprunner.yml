name: Deploy Chronos to AWS App Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  APP_NAME: flolabs-chronos
  ECR_REPOSITORY: flolabs-chronos
  APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:us-east-1:975049954782:service/flolabs-chronos/b6416d84200e4c5a9d884f8f4c134aaf
  VPC_CONNECTOR_ARN: arn:aws:apprunner:us-east-1:975049954782:vpcconnector/flolabs-chronos-vpc-connector/1/41208035860d463f92e083af41247fe1
  APP_RUNNER_ECR_ACCESS_ROLE_ARN: arn:aws:iam::975049954782:role/flolabs-chronos-apprunner-ecr-access-role
  GITHUB_ACTIONS_DEPLOY_ROLE_ARN: arn:aws:iam::975049954782:role/flolabs-chronos-github-actions-deploy
  APP_RUNNER_URL: https://hcmsmnfq5q.us-east-1.awsapprunner.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: chronos-deploy-main
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE_TAG="git-${SHORT_SHA}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          LATEST_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "latest_uri=${LATEST_URI}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.meta.outputs.latest_uri }}
          build-args: |
            BUILD_COMMIT_SHA=${{ github.sha }}
            BUILD_COMMIT_REF=${{ github.ref_name }}
            BUILD_IMAGE_TAG=${{ steps.meta.outputs.image_tag }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.build_timestamp }}

      - name: Resolve ECR image digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${{ steps.meta.outputs.image_tag }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "${AWS_REGION}")
          if [[ -z "$DIGEST" || "$DIGEST" == "None" ]]; then
            echo "Could not resolve image digest from ECR" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Resolve runtime secrets from AWS SSM
        id: runtime-secrets
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL=$(aws ssm get-parameter --name /flolabs-chronos/DATABASE_URL --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          REDIS_URL=$(aws ssm get-parameter --name /flolabs-chronos/REDIS_URL --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          CRON_SECRET=$(aws ssm get-parameter --name /flolabs-chronos/CRON_SECRET --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          RESEND_API_KEY=$(aws ssm get-parameter --name /flolabs-chronos/RESEND_API_KEY --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          set +e
          EMAIL_FROM=$(aws ssm get-parameter --name /flolabs-chronos/EMAIL_FROM --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text 2>/dev/null)
          email_from_code=$?
          set -e
          if [[ "$email_from_code" -ne 0 ]] || [[ -z "${EMAIL_FROM//[$'\t\r\n ']}" ]]; then
            EMAIL_FROM=$(aws ssm get-parameter --name /flolabs-chronos/INVITE_FROM_EMAIL --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text)
          fi
          RESET_PASSWORD_TEST_EMAIL=$(aws ssm get-parameter --name /flolabs-chronos/RESET_PASSWORD_TEST_EMAIL --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text 2>/dev/null || true)
          RESET_PASSWORD_TEST_SECRET=$(aws ssm get-parameter --name /flolabs-chronos/RESET_PASSWORD_TEST_SECRET --with-decryption --region "${AWS_REGION}" --query 'Parameter.Value' --output text 2>/dev/null || true)
          {
            echo "database_url<<EOF"
            echo "$DATABASE_URL"
            echo "EOF"
            echo "redis_url<<EOF"
            echo "$REDIS_URL"
            echo "EOF"
            echo "cron_secret<<EOF"
            echo "$CRON_SECRET"
            echo "EOF"
            echo "resend_api_key<<EOF"
            echo "$RESEND_API_KEY"
            echo "EOF"
            echo "email_from<<EOF"
            echo "$EMAIL_FROM"
            echo "EOF"
            echo "reset_password_test_email<<EOF"
            echo "$RESET_PASSWORD_TEST_EMAIL"
            echo "EOF"
            echo "reset_password_test_secret<<EOF"
            echo "$RESET_PASSWORD_TEST_SECRET"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Render App Runner source configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > apprunner-source.json <<JSON
          {
            "AuthenticationConfiguration": {
              "AccessRoleArn": "${APP_RUNNER_ECR_ACCESS_ROLE_ARN}"
            },
            "AutoDeploymentsEnabled": true,
            "ImageRepository": {
              "ImageIdentifier": "${{ steps.meta.outputs.image_uri }}",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "3000",
                "RuntimeEnvironmentVariables": {
                  "APP_URL": "${APP_RUNNER_URL}",
                  "AUTH_SECRET": "${{ secrets.AUTH_SECRET }}",
                  "CRON_SECRET": "${{ steps.runtime-secrets.outputs.cron_secret }}",
                  "DATABASE_URL": "${{ steps.runtime-secrets.outputs.database_url }}",
                  "FL_CHRONOS_DATABASE_URL": "${{ steps.runtime-secrets.outputs.database_url }}",
                  "FL_CHRONOS_DATABASE_URL_UNPOOLED": "${{ steps.runtime-secrets.outputs.database_url }}",
                  "FL_KV_REDIS_URL": "${{ steps.runtime-secrets.outputs.redis_url }}",
                  "KV_URL": "${{ steps.runtime-secrets.outputs.redis_url }}",
                  "NEXTAUTH_SECRET": "${{ secrets.AUTH_SECRET }}",
                  "NEXTAUTH_URL": "${APP_RUNNER_URL}",
                  "NODE_ENV": "production",
                  "NOTION_API_KEY": "${{ secrets.NOTION_API_KEY }}",
                  "NOTION_DATABASE_ID": "${{ secrets.NOTION_DATABASE_ID }}",
                  "NOTION_ONBOARDINGS_DB_ID": "${{ secrets.NOTION_ONBOARDINGS_DB_ID }}",
                  "NOTION_TASKS_DB_ID": "${{ secrets.NOTION_TASKS_DB_ID }}",
                  "NOTION_TEAMS_DB_ID": "${{ secrets.NOTION_TEAMS_DB_ID }}",
                  "NOTION_TEAM_MEMBERS_DB_ID": "${{ secrets.NOTION_TEAM_MEMBERS_DB_ID }}",
                  "RESEND_API_KEY": "${{ steps.runtime-secrets.outputs.resend_api_key }}",
                  "EMAIL_FROM": "${{ steps.runtime-secrets.outputs.email_from }}",
                  "RESET_PASSWORD_TEST_EMAIL": "${{ steps.runtime-secrets.outputs.reset_password_test_email }}",
                  "RESET_PASSWORD_TEST_SECRET": "${{ steps.runtime-secrets.outputs.reset_password_test_secret }}",
                  "NX_DAEMON": "false",
                  "BUILD_COMMIT_SHA": "${{ github.sha }}",
                  "BUILD_COMMIT_REF": "${{ github.ref_name }}",
                  "BUILD_IMAGE_TAG": "${{ steps.meta.outputs.image_tag }}",
                  "BUILD_IMAGE_DIGEST": "${{ steps.digest.outputs.digest }}",
                  "BUILD_TIMESTAMP": "${{ steps.meta.outputs.build_timestamp }}",
                  "NEXT_PUBLIC_BUILD_COMMIT_SHA": "${{ github.sha }}",
                  "NEXT_PUBLIC_BUILD_COMMIT_REF": "${{ github.ref_name }}",
                  "NEXT_PUBLIC_BUILD_IMAGE_TAG": "${{ steps.meta.outputs.image_tag }}",
                  "NEXT_PUBLIC_BUILD_IMAGE_DIGEST": "${{ steps.digest.outputs.digest }}",
                  "NEXT_PUBLIC_BUILD_TIMESTAMP": "${{ steps.meta.outputs.build_timestamp }}"
                }
              }
            }
          }
          JSON

      - name: Render App Runner instance configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > apprunner-service.json <<JSON
          {
            "Cpu": "1 vCPU",
            "Memory": "2 GB"
          }
          JSON

      - name: Wait for App Runner to become idle
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            SERVICE_STATUS=$(aws apprunner describe-service \
              --service-arn "${APP_RUNNER_SERVICE_ARN}" \
              --region "${AWS_REGION}" \
              --query 'Service.Status' \
              --output text)
            LATEST_OPERATION_STATUS=$(aws apprunner list-operations \
              --service-arn "${APP_RUNNER_SERVICE_ARN}" \
              --region "${AWS_REGION}" \
              --max-results 1 \
              --query 'OperationSummaryList[0].Status' \
              --output text)
            echo "App Runner idle check: service=${SERVICE_STATUS} latestOperation=${LATEST_OPERATION_STATUS} attempt=${attempt}/60"
            if [[ "$SERVICE_STATUS" == "RUNNING" && "$LATEST_OPERATION_STATUS" != "IN_PROGRESS" && "$LATEST_OPERATION_STATUS" != "PENDING" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "App Runner never became idle before update attempt" >&2
          exit 1

      - name: Update App Runner service
        id: update
        shell: bash
        run: |
          set -euo pipefail
          OPERATION_ID=$(aws apprunner update-service \
            --service-arn "${APP_RUNNER_SERVICE_ARN}" \
            --source-configuration file://apprunner-source.json \
            --instance-configuration file://apprunner-service.json \
            --network-configuration "EgressConfiguration={EgressType=VPC,VpcConnectorArn=${VPC_CONNECTOR_ARN}}" \
            --region "${AWS_REGION}" \
            --query 'OperationId' \
            --output text)
          echo "operation_id=${OPERATION_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for App Runner operation
        id: wait-operation
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            STATUS=$(aws apprunner list-operations \
              --service-arn "${APP_RUNNER_SERVICE_ARN}" \
              --region "${AWS_REGION}" \
              --query "OperationSummaryList[?Id=='${{ steps.update.outputs.operation_id }}'].Status | [0]" \
              --output text)
            if [[ -z "$STATUS" || "$STATUS" == "None" ]]; then
              STATUS=$(aws apprunner list-operations \
                --service-arn "${APP_RUNNER_SERVICE_ARN}" \
                --region "${AWS_REGION}" \
                --query 'OperationSummaryList[0].Status' \
                --output text)
            fi
            echo "App Runner operation status: $STATUS"
            if [[ "$STATUS" == "SUCCEEDED" ]]; then
              exit 0
            fi
            if [[ "$STATUS" != "IN_PROGRESS" && "$STATUS" != "PENDING" ]]; then
              echo "Deployment failed with status: $STATUS" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Wait for deployed image to become current
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_IMAGE="${{ steps.meta.outputs.image_uri }}"
          for attempt in {1..30}; do
            CURRENT_IMAGE=$(aws apprunner describe-service \
              --service-arn "${APP_RUNNER_SERVICE_ARN}" \
              --region "${AWS_REGION}" \
              --query 'Service.SourceConfiguration.ImageRepository.ImageIdentifier' \
              --output text)
            SERVICE_STATUS=$(aws apprunner describe-service \
              --service-arn "${APP_RUNNER_SERVICE_ARN}" \
              --region "${AWS_REGION}" \
              --query 'Service.Status' \
              --output text)
            echo "Current image=${CURRENT_IMAGE} status=${SERVICE_STATUS} attempt=${attempt}/30"
            if [[ "$CURRENT_IMAGE" == "$EXPECTED_IMAGE" && "$SERVICE_STATUS" == "RUNNING" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployed image never became current: expected ${EXPECTED_IMAGE}" >&2
          exit 1

      - name: Run ownership migration inside AWS service
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl -fsSL \
            -H "authorization: Bearer ${{ steps.runtime-secrets.outputs.cron_secret }}" \
            "${APP_RUNNER_URL}/api/cron/time-entries-audit")
          echo "$BODY"
          echo "$BODY" | python -c "import json,sys; data=json.load(sys.stdin); sys.exit(0 if data.get('ok') else 1)"

      - name: Sync Team Members links from Notion
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl -fsSL \
            -H "authorization: Bearer ${{ steps.runtime-secrets.outputs.cron_secret }}" \
            "${APP_RUNNER_URL}/api/cron/teams-sync")
          echo "$BODY"
          echo "$BODY" | python -c "import json,sys; data=json.load(sys.stdin); sys.exit(0 if isinstance(data, dict) else 1)"

      - name: Sync Notion time entry links
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl -fsSL \
            -H "authorization: Bearer ${{ steps.runtime-secrets.outputs.cron_secret }}" \
            "${APP_RUNNER_URL}/api/cron/notion-sync")
          echo "$BODY"
          echo "$BODY" | python -c "import json,sys; data=json.load(sys.stdin); sys.exit(0 if isinstance(data, dict) else 1)"

      - name: Verify repaired ownership and links
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl -fsSL \
            -H "authorization: Bearer ${{ steps.runtime-secrets.outputs.cron_secret }}" \
            "${APP_RUNNER_URL}/api/cron/time-entries-audit")
          echo "$BODY"
          echo "$BODY" | python -c "import json,sys; data=json.load(sys.stdin); s=(data.get('summary') or {}); ok=data.get('ok') and int(s.get('linked_accounts_not_joined_or_inactive',0))==0 and int(s.get('entries_missing_team_member_link',0))<50; sys.exit(0 if ok else 1)"

      - name: Verify deployed health metadata
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            BODY=$(curl -fsSL "${APP_RUNNER_URL}/api/health") && true || BODY=""
            if [[ -n "$BODY" ]]; then
              echo "$BODY"
              if echo "$BODY" | grep -F '"ok":true' >/dev/null && \
                 echo "$BODY" | grep -F '"commitSha":"${{ github.sha }}"' >/dev/null; then
                exit 0
              fi
            fi
            echo "Health metadata not updated yet (attempt ${attempt}/30)"
            sleep 10
          done
          echo "Timed out waiting for deployed health metadata to match commit ${{ github.sha }}" >&2
          exit 1
