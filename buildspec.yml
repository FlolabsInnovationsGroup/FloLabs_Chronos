version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    ECR_REPOSITORY: flolabs-chronos
    APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:us-east-1:975049954782:service/flolabs-chronos/b6416d84200e4c5a9d884f8f4c134aaf
    VPC_CONNECTOR_ARN: arn:aws:apprunner:us-east-1:975049954782:vpcconnector/flolabs-chronos-vpc-connector/1/41208035860d463f92e083af41247fe1
    APP_RUNNER_ECR_ACCESS_ROLE_ARN: arn:aws:iam::975049954782:role/flolabs-chronos-apprunner-ecr-access-role
    APP_URL: https://hcmsmnfq5q.us-east-1.awsapprunner.com
    AUTO_SCALING_ARN: arn:aws:apprunner:us-east-1:975049954782:autoscalingconfiguration/flolabs-apps/1/4efd22c66e1440f8b3047d3f13094299

phases:
  pre_build:
    commands:
      - set -eu
      - COMMIT_SHA="${GIT_SHA:-${CODEBUILD_RESOLVED_SOURCE_VERSION}}"
      - SHORT_SHA="$(printf '%.12s' "$COMMIT_SHA")"
      - IMAGE_TAG="git-${SHORT_SHA}"
      - ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
      - BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - echo "IMAGE_TAG=${IMAGE_TAG}" >> /tmp/build.env
      - echo "IMAGE_URI=${IMAGE_URI}" >> /tmp/build.env
      - echo "LATEST_URI=${REGISTRY}/${ECR_REPOSITORY}:latest" >> /tmp/build.env
      - echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> /tmp/build.env
      - echo "SHORT_SHA=${SHORT_SHA}" >> /tmp/build.env
      - echo "COMMIT_SHA=${COMMIT_SHA}" >> /tmp/build.env
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - export DATABASE_URL="$(aws ssm get-parameter --name /flolabs-chronos/DATABASE_URL --with-decryption --query 'Parameter.Value' --output text --region "$AWS_REGION")"
      - export REDIS_URL="$(aws ssm get-parameter --name /flolabs-chronos/REDIS_URL --with-decryption --query 'Parameter.Value' --output text --region "$AWS_REGION")"
      - export CRON_SECRET="$(aws ssm get-parameter --name /flolabs-chronos/CRON_SECRET --with-decryption --query 'Parameter.Value' --output text --region "$AWS_REGION")"
      - export RESEND_API_KEY="$(aws ssm get-parameter --name /flolabs-chronos/RESEND_API_KEY --with-decryption --query 'Parameter.Value' --output text --region "$AWS_REGION")"
      - export NOTION_API_KEY="$(aws ssm get-parameter --name /flolabs-chronos/NOTION_API_KEY --with-decryption --query 'Parameter.Value' --output text --region "$AWS_REGION")"
      - export EMAIL_FROM="$(aws ssm get-parameter --name /flolabs-chronos/EMAIL_FROM --with-decryption --query 'Parameter.Value' --output text --region "$AWS_REGION" 2>/dev/null || true)"
      - |
        CURRENT_JSON="$(aws apprunner describe-service --service-arn "$APP_RUNNER_SERVICE_ARN" --region "$AWS_REGION" --query 'Service.SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentVariables' --output json)"
        export AUTH_SECRET="$(echo "$CURRENT_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('AUTH_SECRET',''))")"
        export NOTION_DATABASE_ID="$(echo "$CURRENT_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('NOTION_DATABASE_ID',''))")"
        export NOTION_ONBOARDINGS_DB_ID="$(echo "$CURRENT_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('NOTION_ONBOARDINGS_DB_ID',''))")"
        export NOTION_TASKS_DB_ID="$(echo "$CURRENT_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('NOTION_TASKS_DB_ID',''))")"
        export NOTION_TEAMS_DB_ID="$(echo "$CURRENT_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('NOTION_TEAMS_DB_ID',''))")"
        export NOTION_TEAM_MEMBERS_DB_ID="$(echo "$CURRENT_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('NOTION_TEAM_MEMBERS_DB_ID',''))")"

  build:
    commands:
      - set -eu
      - . /tmp/build.env
      - |
        docker build \
          --build-arg BUILD_COMMIT_SHA="$COMMIT_SHA" \
          --build-arg BUILD_COMMIT_REF=main \
          --build-arg BUILD_IMAGE_TAG="$IMAGE_TAG" \
          --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
          -t "$IMAGE_URI" \
          -t "$LATEST_URI" \
          .
      - docker push "$IMAGE_URI"
      - docker push "$LATEST_URI"

  post_build:
    commands:
      - set -eu
      - . /tmp/build.env
      - DIGEST="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text --region "$AWS_REGION")"
      - export DIGEST IMAGE_URI IMAGE_TAG BUILD_TIMESTAMP COMMIT_SHA AUTH_SECRET NOTION_API_KEY NOTION_DATABASE_ID NOTION_ONBOARDINGS_DB_ID NOTION_TASKS_DB_ID NOTION_TEAMS_DB_ID NOTION_TEAM_MEMBERS_DB_ID DATABASE_URL REDIS_URL CRON_SECRET RESEND_API_KEY EMAIL_FROM
      - |
        python3 <<'PY'
        import json, os
        env = {
          "APP_URL": os.environ["APP_URL"],
          "AUTH_SECRET": os.environ["AUTH_SECRET"],
          "NEXTAUTH_SECRET": os.environ["AUTH_SECRET"],
          "NEXTAUTH_URL": os.environ["APP_URL"],
          "NODE_ENV": "production",
          "DATABASE_URL": os.environ["DATABASE_URL"],
          "FL_CHRONOS_DATABASE_URL": os.environ["DATABASE_URL"],
          "FL_CHRONOS_DATABASE_URL_UNPOOLED": os.environ["DATABASE_URL"],
          "KV_URL": os.environ["REDIS_URL"],
          "FL_KV_REDIS_URL": os.environ["REDIS_URL"],
          "CRON_SECRET": os.environ["CRON_SECRET"],
          "RESEND_API_KEY": os.environ.get("RESEND_API_KEY", ""),
          "EMAIL_FROM": os.environ.get("EMAIL_FROM", ""),
          "NOTION_API_KEY": os.environ.get("NOTION_API_KEY", ""),
          "NOTION_DATABASE_ID": os.environ.get("NOTION_DATABASE_ID", ""),
          "NOTION_ONBOARDINGS_DB_ID": os.environ.get("NOTION_ONBOARDINGS_DB_ID", ""),
          "NOTION_TASKS_DB_ID": os.environ.get("NOTION_TASKS_DB_ID", ""),
          "NOTION_TEAMS_DB_ID": os.environ.get("NOTION_TEAMS_DB_ID", ""),
          "NOTION_TEAM_MEMBERS_DB_ID": os.environ.get("NOTION_TEAM_MEMBERS_DB_ID", ""),
          "NX_DAEMON": "false",
          "BUILD_COMMIT_SHA": os.environ.get("COMMIT_SHA", ""),
          "BUILD_COMMIT_REF": "main",
          "BUILD_IMAGE_TAG": os.environ["IMAGE_TAG"],
          "BUILD_IMAGE_DIGEST": os.environ["DIGEST"],
          "BUILD_TIMESTAMP": os.environ["BUILD_TIMESTAMP"],
          "NEXT_PUBLIC_BUILD_COMMIT_SHA": os.environ.get("COMMIT_SHA", ""),
          "NEXT_PUBLIC_BUILD_COMMIT_REF": "main",
          "NEXT_PUBLIC_BUILD_IMAGE_TAG": os.environ["IMAGE_TAG"],
          "NEXT_PUBLIC_BUILD_IMAGE_DIGEST": os.environ["DIGEST"],
          "NEXT_PUBLIC_BUILD_TIMESTAMP": os.environ["BUILD_TIMESTAMP"],
        }
        source = {
          "AuthenticationConfiguration": {"AccessRoleArn": os.environ["APP_RUNNER_ECR_ACCESS_ROLE_ARN"]},
          "AutoDeploymentsEnabled": True,
          "ImageRepository": {
            "ImageIdentifier": os.environ["IMAGE_URI"],
            "ImageRepositoryType": "ECR",
            "ImageConfiguration": {"Port": "3000", "RuntimeEnvironmentVariables": env},
          },
        }
        with open("apprunner-source.json", "w", encoding="utf-8") as f:
          json.dump(source, f)
        with open("apprunner-service.json", "w", encoding="utf-8") as f:
          json.dump({"Cpu": "2 vCPU", "Memory": "4 GB"}, f)
        PY
      - |
        for attempt in $(seq 1 60); do
          SERVICE_STATUS="$(aws apprunner describe-service --service-arn "$APP_RUNNER_SERVICE_ARN" --region "$AWS_REGION" --query 'Service.Status' --output text)"
          LATEST_OPERATION_STATUS="$(aws apprunner list-operations --service-arn "$APP_RUNNER_SERVICE_ARN" --region "$AWS_REGION" --max-results 1 --query 'OperationSummaryList[0].Status' --output text)"
          if [ "$LATEST_OPERATION_STATUS" = "None" ] || [ -z "$LATEST_OPERATION_STATUS" ]; then
            LATEST_OPERATION_STATUS="SUCCEEDED"
          fi
          echo "idle check service=${SERVICE_STATUS} op=${LATEST_OPERATION_STATUS} attempt=${attempt}"
          if [ "$SERVICE_STATUS" = "RUNNING" ] && [ "$LATEST_OPERATION_STATUS" != "IN_PROGRESS" ] && [ "$LATEST_OPERATION_STATUS" != "PENDING" ]; then
            break
          fi
          sleep 10
        done
      - |
        OPERATION_ID="$(aws apprunner update-service \
          --service-arn "$APP_RUNNER_SERVICE_ARN" \
          --source-configuration file://apprunner-source.json \
          --instance-configuration file://apprunner-service.json \
          --auto-scaling-configuration-arn "$AUTO_SCALING_ARN" \
          --network-configuration "EgressConfiguration={EgressType=VPC,VpcConnectorArn=$VPC_CONNECTOR_ARN}" \
          --region "$AWS_REGION" \
          --query 'OperationId' \
          --output text)"
        echo "operation_id=$OPERATION_ID"
        while true; do
          STATUS="$(aws apprunner list-operations --service-arn "$APP_RUNNER_SERVICE_ARN" --region "$AWS_REGION" --query "OperationSummaryList[?Id=='$OPERATION_ID'].Status | [0]" --output text)"
          echo "operation status=$STATUS"
          if [ "$STATUS" = "SUCCEEDED" ]; then break; fi
          if [ "$STATUS" = "None" ] || [ -z "$STATUS" ]; then
            sleep 10
            continue
          fi
          if [ "$STATUS" != "IN_PROGRESS" ] && [ "$STATUS" != "PENDING" ]; then exit 1; fi
          sleep 10
        done
      - |
        for attempt in $(seq 1 45); do
          BODY="$(curl -fsSL --connect-timeout 10 --max-time 25 "${APP_URL}/api/health" || true)"
          echo "$BODY"
          if echo "$BODY" | grep -F '"ok":true' >/dev/null && echo "$BODY" | grep -F "${COMMIT_SHA}" >/dev/null; then
            exit 0
          fi
          sleep 10
        done
        exit 1
